services:
  resume:
    image: wifsimster/resume:latest
    container_name: resume
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - lan
    labels:
      - traefik.enable=true
      - traefik.http.routers.resume.rule=Host(`cv.battistella.ovh`)
      - traefik.http.routers.resume.entrypoints=websecure
      - traefik.http.routers.resume.tls.certresolver=letsencrypt
      - traefik.http.services.resume.loadbalancer.server.port=80

  # Chat backend of the conversational resume (/?ui=alpha). Without any
  # provider variable set the frontend silently falls back to scripted mode.
  chat:
    image: wifsimster/resume-chat:latest
    container_name: resume-chat
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Option 1 — Google AI Studio (free tier): https://aistudio.google.com/apikey
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      # Option 2 — any OpenAI-compatible endpoint (Ollama local, LM Studio,
      # HuggingFace router, OpenRouter…): takes precedence when set
      - CHAT_API_BASE_URL=${CHAT_API_BASE_URL:-}
      - CHAT_API_KEY=${CHAT_API_KEY:-}
      - CHAT_MODEL=${CHAT_MODEL:-}
      # Conversation logs: JSONL per day in ./chat-logs (create it with
      # `mkdir chat-logs && chown 1000:1000 chat-logs` — the container runs
      # as the node user). Set CHAT_ADMIN_TOKEN to enable GET /api/chat/logs.
      - CHAT_LOG_DIR=${CHAT_LOG_DIR:-/data/logs}
      - CHAT_ADMIN_TOKEN=${CHAT_ADMIN_TOKEN:-}
    volumes:
      - ./chat-logs:/data/logs
    networks:
      - lan

networks:
  lan:
    external: true
